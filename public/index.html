<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20172d"><title>Amara</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#181324,#3b2554);color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}.app{width:min(100%,480px);padding:22px;text-align:center}h1{font-weight:500;letter-spacing:.16em;margin:8px 0 4px}.subtitle{opacity:.7;font-size:13px;margin-bottom:22px}.portrait{position:relative;margin:auto;width:min(78vw,320px);aspect-ratio:3/4;overflow:hidden;border-radius:44% 44% 24px 24px;box-shadow:0 12px 50px #0008;animation:breathe 5s ease-in-out infinite}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center;animation:float 7s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.015)}}@keyframes float{50%{transform:scale(1.035) translateY(3px)}}.panel{margin:24px auto 0;background:#ffffff12;border:1px solid #ffffff25;border-radius:20px;padding:18px}.status{font-size:14px;min-height:40px;line-height:1.5}button{border:0;border-radius:24px;padding:12px 20px;background:#ddbddf;color:#261a32;font-weight:650;font-size:15px;margin:6px;cursor:pointer}button:disabled{opacity:.5}.note{font-size:12px;opacity:.65;line-height:1.5;margin-top:15px}.voice-controls{margin-top:12px}.voice-controls button{background:#e7c8ed}.voice-controls button:focus-visible{outline:3px solid white}.voice-help{font-size:12px;opacity:.75;line-height:1.5;margin-top:10px}</style></head><body><main class="app"><h1>AMARA</h1><div class="subtitle">A first glimpse</div><div class="portrait"><img src="/portrait.jpg" alt="Amara portrait"></div><section class="panel"><div class="status" id="status" role="status" aria-live="polite">Ready when you are.</div><button id="speak">Hear my greeting</button><button id="stop">Stop</button><div class="voice-controls"><button id="connectVoice">Start live conversation</button><button id="endVoice" disabled>End conversation</button><button id="muteVoice" disabled aria-pressed="false">Mute microphone</button><button id="playVoice" hidden>Play Amara’s audio</button></div><div class="voice-help" id="voiceHelp">Tap Start to speak with Amara. Your microphone is used only during a conversation.</div><div class="note">Amara is an AI voice companion. End conversation to turn off your microphone. Portrait movement is decorative; facial lip sync and persistent memory are not connected.</div></section></main><script src="/voice.js" defer></script></body></html>
